name: Vercel Diagnosis (manual)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'diag | dns-records | disable-challenge | remove-domain'
        required: true
        default: 'diag'

env:
  TEAM: team_Yfsepduh4B0KfJ8HBnL77RBy

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Vercel API
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ACT: ${{ github.event.inputs.action }}
        run: |
          set -e
          H="Authorization: Bearer $TOKEN"
          api() { curl -s -H "$H" "https://api.vercel.com$1"; }

          echo "== all projects =="
          api "/v9/projects?teamId=$TEAM&limit=20" > projs.json
          python3 - <<'PY'
          import json
          d=json.load(open('projs.json'))
          for p in d.get('projects',[]):
              print(p['name'], '| id=', p['id'], '| latest=', (p.get('latestDeployments') or [{}])[0].get('url',''))
          PY

          echo "== find alias owner =="
          api "/v4/aliases/mainragames.com?teamId=$TEAM" | head -c 600; echo
          api "/v13/deployments/mainragames.com?teamId=$TEAM" 2>/dev/null | head -c 200; echo

          echo "== domain config / aliases detail =="
          api "/v4/domains/mainragames.com?teamId=$TEAM" > dom.json
          python3 - <<'PY'
          import json
          d=json.load(open('dom.json'))['domain']
          print('aliases:', [a['alias'] for a in d.get('aliases',[])])
          print('cdnEnabled:', d.get('cdnEnabled'), '| zone:', d.get('zone'))
          PY

          if [ "$ACT" = "disable-challenge" ]; then
            PID=$(python3 -c "
          import json
          d=json.load(open('projs.json'))
          ps=d.get('projects',[])
          print(ps[0]['name'] if ps else '')")
            echo "== PATCH protections on project: $PID =="
            CODE=$(curl -s -o resp.json -w '%{http_code}' -X PATCH -H "$H" -H 'Content-Type: application/json' \
              -d '{"attackChallengeMode":false}' \
              "https://api.vercel.com/v9/projects/$PID?teamId=$TEAM")
            echo "PATCH: $CODE"; head -c 300 resp.json; echo
          fi

          if [ "$ACT" = "remove-domain" ]; then
            PID=$(python3 -c "
          import json
          d=json.load(open('projs.json'))
          ps=d.get('projects',[])
          print(ps[0]['name'] if ps else '')")
            echo "== remove domain from project $PID =="
            CODE=$(curl -s -o resp.json -w '%{http_code}' -X DELETE -H "$H" \
              "https://api.vercel.com/v9/projects/$PID/domains/mainragames.com?teamId=$TEAM")
            echo "project removal: $CODE"; head -c 300 resp.json; echo
            CODE2=$(curl -s -o resp2.json -w '%{http_code}' -X DELETE -H "$H" \
              "https://api.vercel.com/v4/domains/mainragames.com?teamId=$TEAM")
            echo "account removal: $CODE2"; head -c 300 resp2.json; echo
          fi
