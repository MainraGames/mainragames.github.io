name: Vercel Diagnosis (manual)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'diag | disable-challenge | remove-domain'
        required: true
        default: 'diag'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Vercel API
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ACT: ${{ github.event.inputs.action }}
        run: |
          set -e
          H="Authorization: Bearer $TOKEN"
          api() { curl -s -H "$H" "https://api.vercel.com$1"; }

          echo "== whoami =="
          api /v2/user | head -c 300; echo

          echo "== projects =="
          api /v9/projects | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          for p in d.get('projects', []):
              print(p['name'], p['id'], [t for t in [p.get('latestDeployments') or []]][:0] or '', p.get('framework') or '')
          " || api /v9/projects | head -c 800

          echo "== domain mainragames.com =="
          api /v4/domains/mainragames.com > dom.json || true
          cat dom.json | head -c 1500; echo

          echo "== who owns the domain (which project) =="
          api "/v9/projects?domain=mainragames.com" | head -c 1000; echo

          if [ "$ACT" = "disable-challenge" ]; then
            echo "== listing deployments for attack-challenge mode =="
            for P in $(api /v9/projects | python3 -c "import sys,json;print(' '.join(p['name'] for p in json.load(sys.stdin).get('projects',[])))"); do
              echo "--- project $P ---"
              for D in $(api "/v6/deployments?project=$P&limit=3&target=production" | python3 -c "import sys,json;print(' '.join(d['uid'] for d in json.load(sys.stdin).get('deployments',[])))"); do
                echo "deployment $D attack mode:"
                api "/v13/deployments/$D" | python3 -c "import sys,json;d=json.load(sys.stdin);print(json.dumps(d.get('attacks') or d.get('attackChallengeMode') or 'none'))" || true
              done
            done
          fi

          if [ "$ACT" = "remove-domain" ]; then
            echo "== REMOVE domain from vercel =="
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "$H" "https://api.vercel.com/v9/projects/mainragames/domains/mainragames.com" )
            echo "project-level removal: $CODE"
            CODE2=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "$H" "https://api.vercel.com/v4/domains/mainragames.com")
            echo "account-level removal: $CODE2"
          fi
