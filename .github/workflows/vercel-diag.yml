name: Vercel Diagnosis (manual)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'diag | dns-records | disable-challenge | remove-domain'
        required: true
        default: 'diag'

env:
  TEAM: team_Yfsepduh4B0KfJ8HBnL77RBy

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Vercel API
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ACT: ${{ github.event.inputs.action }}
        run: |
          set -e
          H="Authorization: Bearer $TOKEN"
          api() { curl -s -H "$H" "https://api.vercel.com$1"; }

          echo "== teams =="
          api /v2/teams | python3 -c "import sys,json;[print(t['id'],t['slug']) for t in json.load(sys.stdin).get('teams',[])]" || true

          echo "== domain (teamId) =="
          api "/v4/domains/mainragames.com?teamId=$TEAM" | head -c 1200; echo

          echo "== project domains =="
          api "/v9/projects/mainragames.com/domains?teamId=$TEAM" | head -c 1500; echo

          echo "== project config (protections) =="
          api "/v9/projects/mainragames.com?teamId=$TEAM" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          keep={k:d.get(k) for k in ['name','id','framework','autoAssignCustomDomains','deploymentExpiration','gitForkProtection','ssoProtection','passwordProtection','trustedIps','productionBranch','serverlessFunctionRegion'] if k in d}
          print(json.dumps(keep,indent=1))" || true

          if [ "$ACT" = "dns-records" ]; then
            echo "== DNS records =="
            api "/v4/domains/mainragames.com/records?teamId=$TEAM" | head -c 2500; echo
          fi

          if [ "$ACT" = "disable-challenge" ]; then
            echo "== disable attack challenge on project =="
            CODE=$(curl -s -o resp.json -w '%{http_code}' -X PATCH -H "$H" -H 'Content-Type: application/json' \
              -d '{"attackChallengeMode":false,"gitForkProtection":false}' \
              "https://api.vercel.com/v9/projects/mainragames.com?teamId=$TEAM")
            echo "PATCH project: $CODE"; cat resp.json | head -c 400; echo
            echo "== latest production deployment =="
            api "/v6/deployments?project=mainragames.com&target=production&limit=1&teamId=$TEAM" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for x in d.get('deployments',[]): print(x['uid'], x.get('url'), 'attacks=', x.get('attacks'))"
          fi

          if [ "$ACT" = "remove-domain" ]; then
            echo "== REMOVE domain from project =="
            CODE=$(curl -s -o resp.json -w '%{http_code}' -X DELETE -H "$H" \
              "https://api.vercel.com/v9/projects/mainragames.com/domains/mainragames.com?teamId=$TEAM")
            echo "project removal: $CODE"; head -c 300 resp.json; echo
            CODE2=$(curl -s -o resp2.json -w '%{http_code}' -X DELETE -H "$H" \
              "https://api.vercel.com/v4/domains/mainragames.com?teamId=$TEAM")
            echo "account removal: $CODE2"; head -c 300 resp2.json; echo
          fi
