name: Update Games from Play Store

on:
  schedule:
    # Jalankan setiap hari jam 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch: # Bisa dijalankan manual dari GitHub Actions tab

permissions:
  contents: write

jobs:
  update-games:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: tools/package-lock.json
      
      - name: Install dependencies
        run: |
          cd tools
          npm ci
      
      - name: Update games from Play Store
        run: |
          cd tools
          npm run update-games
      
      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain Assets/data/games-data.json)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Assets/data/games-data.json
          git commit -m "Auto-update games from Play Store [skip ci]"
          git push

